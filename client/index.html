<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=7" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ParkShare" />
    <title>BCI ParkShare</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="description" content="BCI ParkShare - corporate parking spot sharing application for efficient allocation and sharing among 1000 employees across 4 locations." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Only Inter is actually used (see tailwind.config.ts fontFamily.sans and
      replit.md UI/UX decisions); font-mono/font-serif fall back to system
      fonts (Menlo/Georgia) and need no download. Weight range is trimmed to
      what's used in the app (400/500/600/700/800; see grep of font-* utility
      classes under client/src). Loaded non-blocking via the preload+swap
      pattern so it never delays first paint.
    -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
  </head>
  <body>
    <div id="root">
      <style>
        #app-loader {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #ffffff;
          z-index: 99999;
          gap: 1.25rem;
          transition: opacity 0.3s ease;
        }
        @media (prefers-color-scheme: dark) {
          #app-loader { background: #09090b; }
          #app-loader .loader-text { color: #fafafa; }
          #app-loader .loader-subtext { color: #a1a1aa; }
        }
        #app-loader .loader-icon {
          width: 48px;
          height: 48px;
          border: 3px solid #e4e4e7;
          border-top-color: #2563eb;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #app-loader .loader-text {
          font-family: 'Inter', system-ui, sans-serif;
          font-size: 1.125rem;
          font-weight: 600;
          color: #18181b;
          letter-spacing: -0.01em;
        }
        #app-loader .loader-subtext {
          font-family: 'Inter', system-ui, sans-serif;
          font-size: 0.8125rem;
          color: #71717a;
          margin-top: -0.5rem;
        }
      </style>
      <div id="app-loader">
        <div class="loader-icon"></div>
        <div class="loader-text">BCI ParkShare</div>
        <div class="loader-subtext" id="loader-subtext">Setting up your parking experience...</div>
      </div>
      <script>
        try {
          if (sessionStorage.getItem('bci_logging_out')) {
            document.getElementById('loader-subtext').textContent = 'Signing you out...';
            sessionStorage.removeItem('bci_logging_out');
          }
        } catch (_) {}
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
