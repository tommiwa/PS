<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">Available workplace parking connected through ParkShare</title>
  <desc id="desc">A text-free navy and teal illustration showing parking provided by BCI and shared by colleagues coming together through a workplace parking service.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#002D4C"/><stop offset="1" stop-color="#075071"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#001F34" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <circle cx="800" cy="265" r="420" fill="#00ABBD" opacity=".06"/>
  <circle cx="800" cy="265" r="310" fill="#00ABBD" opacity=".05"/>
  <path d="M0 500 C360 435 640 545 980 480 C1230 430 1430 458 1600 410 L1600 600 L0 600Z" fill="#00263F" opacity=".78"/>

  <!-- BCI building and parking supply -->
  <g transform="translate(150 105)" filter="url(#shadow)">
    <rect width="350" height="315" rx="26" fill="#F7FAFC"/>
    <rect x="67" y="70" width="216" height="190" rx="8" fill="#DDE3E8"/>
    <rect x="92" y="95" width="42" height="42" fill="#467B96"/>
    <rect x="154" y="95" width="42" height="42" fill="#00ABBD"/>
    <rect x="216" y="95" width="42" height="42" fill="#467B96"/>
    <rect x="92" y="157" width="42" height="42" fill="#00ABBD"/>
    <rect x="216" y="157" width="42" height="42" fill="#00ABBD"/>
    <rect x="154" y="197" width="42" height="63" fill="#00365B"/>
    <path d="M45 265h260v16H45z" fill="#00365B"/>
    <circle cx="312" cy="52" r="24" fill="#E0F6F8"/>
    <path d="M300 62h24V38h-24zm6-18h12v12h-12z" fill="#007D91"/>
  </g>

  <!-- Colleagues sharing a spot -->
  <g transform="translate(1100 105)" filter="url(#shadow)">
    <rect width="350" height="315" rx="26" fill="#F7FAFC"/>
    <circle cx="142" cy="112" r="48" fill="#00ABBD"/>
    <circle cx="221" cy="112" r="48" fill="#467B96"/>
    <path d="M63 255c5-76 43-111 92-111 35 0 62 17 78 50 15-33 43-50 78-50 49 0 87 35 92 111z" transform="translate(-58)" fill="#DDE3E8"/>
    <path d="M76 255c4-59 31-91 76-91s72 32 76 91z" fill="#007D91"/>
    <path d="M154 255c4-59 31-91 76-91s72 32 76 91z" fill="#00365B" opacity=".9"/>
    <circle cx="314" cy="52" r="24" fill="#E0F6F8"/>
    <circle cx="307" cy="47" r="8" fill="#007D91"/><circle cx="321" cy="47" r="8" fill="#467B96"/>
    <path d="M295 65c2-11 9-16 19-16s17 5 19 16z" fill="#00365B"/>
  </g>

  <!-- Both sources connect to the parking service -->
  <path d="M515 260h130M1085 260H955" fill="none" stroke="#62D4DE" stroke-width="8" stroke-linecap="round"/>
  <path d="M645 260c0-86 69-155 155-155s155 69 155 155" fill="none" stroke="#62D4DE" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 18"/>
  <circle cx="645" cy="260" r="14" fill="#00ABBD"/><circle cx="955" cy="260" r="14" fill="#00ABBD"/>

  <!-- Text-free parking/app symbol -->
  <g transform="translate(665 145)" filter="url(#shadow)">
    <rect width="270" height="270" rx="46" fill="#00ABBD"/>
    <rect x="48" y="42" width="174" height="150" rx="26" fill="#FFFFFF"/>
    <path d="M87 151V83h58c36 0 57 18 57 50 0 33-21 51-57 51h-22v-33zm36-29h20c15 0 23-7 23-20 0-12-8-19-23-19h-20z" fill="#00365B"/>
    <path d="M88 222h94" stroke="#00365B" stroke-width="14" stroke-linecap="round"/>
    <circle cx="204" cy="222" r="13" fill="#00365B"/>
  </g>

  <!-- Cars moving into available spaces -->
  <g transform="translate(245 438)">
    <path d="M28 55l22-42h152l27 42z" fill="#DDE3E8"/><rect x="0" y="50" width="255" height="70" rx="22" fill="#467B96"/>
    <path d="M70 25h105l20 30H54z" fill="#C8D5DE"/><circle cx="58" cy="120" r="22" fill="#142B3A"/><circle cx="198" cy="120" r="22" fill="#142B3A"/>
  </g>
  <g transform="translate(1100 438)">
    <path d="M28 55l22-42h152l27 42z" fill="#DDE3E8"/><rect x="0" y="50" width="255" height="70" rx="22" fill="#00ABBD"/>
    <path d="M70 25h105l20 30H54z" fill="#BDEAF0"/><circle cx="58" cy="120" r="22" fill="#142B3A"/><circle cx="198" cy="120" r="22" fill="#142B3A"/>
  </g>
  <path d="M530 530h160M910 530h160" stroke="#62D4DE" stroke-width="6" stroke-linecap="round" stroke-dasharray="9 15"/>
</svg>