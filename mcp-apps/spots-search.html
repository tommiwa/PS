<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Available Parking Spots</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans, system-ui, -apple-system, sans-serif);
      background: var(--color-background-primary, #ffffff);
      color: var(--color-text-primary, #1a1a1a);
      padding: 16px;
      line-height: 1.5;
    }
    [data-theme="dark"] body {
      background: var(--color-background-primary, #1a1a2e);
      color: var(--color-text-primary, #e0e0e0);
    }

    .app-container {
      border: 1px solid var(--color-border-primary, #e0e0e0);
      border-radius: 10px;
      overflow: hidden;
      background: var(--color-background-primary, #ffffff);
    }
    [data-theme="dark"] .app-container {
      border-color: var(--color-border-primary, #3a3a4e);
      background: var(--color-background-primary, #1a1a2e);
    }

    .app-header {
      background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .app-logo {
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.2);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .app-logo svg { width: 18px; height: 18px; color: white; }
    .app-header-text h2 { font-size: 15px; font-weight: 600; color: white; }
    .app-header-text p { font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 1px; }

    .app-body { padding: 14px 18px 18px; }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .filters input {
      padding: 6px 10px;
      border: 1px solid var(--color-border-primary, #d1d5db);
      border-radius: 6px;
      font-size: 13px;
      background: var(--color-background-secondary, #f9fafb);
      color: inherit;
      outline: none;
      flex: 1;
      min-width: 130px;
    }
    [data-theme="dark"] .filters input {
      background: var(--color-background-secondary, #2a2a3e);
      border-color: var(--color-border-primary, #3a3a4e);
    }
    .filters input:focus { border-color: #3b82f6; }
    .btn {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn:hover { opacity: 0.88; }
    .btn-primary { background: #3b82f6; color: white; }

    .count {
      font-size: 12px;
      opacity: 0.5;
      margin-bottom: 10px;
    }

    .spots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 8px;
    }
    .spot-card {
      border: 1px solid var(--color-border-primary, #e5e7eb);
      border-radius: 8px;
      padding: 12px 14px;
      background: var(--color-background-secondary, #f9fafb);
    }
    [data-theme="dark"] .spot-card {
      background: var(--color-background-secondary, #2a2a3e);
      border-color: var(--color-border-primary, #3a3a4e);
    }
    .spot-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .spot-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .spot-price { font-weight: 600; color: #059669; font-size: 13px; white-space: nowrap; }
    [data-theme="dark"] .spot-price { color: #34d399; }

    .spot-meta { font-size: 12px; opacity: 0.6; display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
    .spot-meta svg { flex-shrink: 0; }
    .spot-badges { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }

    .badge {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
    }
    .badge-type { background: #dbeafe; color: #1d4ed8; }
    .badge-charity { background: #fce7f3; color: #be185d; }
    .badge-listing { background: #f0fdf4; color: #166534; }
    [data-theme="dark"] .badge-type { background: #1e3a5f; color: #93c5fd; }
    [data-theme="dark"] .badge-charity { background: #4a1942; color: #f9a8d4; }
    [data-theme="dark"] .badge-listing { background: #14332a; color: #6ee7b7; }

    .empty-state { text-align: center; padding: 32px 16px; opacity: 0.5; }
    .empty-state svg { width: 40px; height: 40px; margin-bottom: 10px; opacity: 0.4; }
    .empty-state p { font-size: 13px; }

    .loading { text-align: center; padding: 32px; opacity: 0.5; font-size: 13px; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="app-header">
      <div class="app-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      </div>
      <div class="app-header-text">
        <h2>BCI ParkShare</h2>
        <p>Available parking spots</p>
      </div>
    </div>
    <div class="app-body">
      <div class="filters">
        <input type="text" id="filter-location" placeholder="Filter by location..." />
        <input type="date" id="filter-date" />
        <button class="btn btn-primary" id="btn-refresh">Refresh</button>
      </div>
      <div id="count" class="count"></div>
      <div id="content" class="loading">Loading...</div>
    </div>
  </div>
  <script type="module" src="/src/spots-search.ts"></script>
</body>
</html>
