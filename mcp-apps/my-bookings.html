<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bookings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans, system-ui, -apple-system, sans-serif);
      background: var(--color-background-primary, #ffffff);
      color: var(--color-text-primary, #1a1a1a);
      padding: 16px;
      line-height: 1.5;
    }
    [data-theme="dark"] body {
      background: var(--color-background-primary, #1a1a2e);
      color: var(--color-text-primary, #e0e0e0);
    }
    .header { margin-bottom: 16px; }
    .header h2 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--color-border-primary, #e0e0e0); padding-bottom: 0; }
    [data-theme="dark"] .tabs { border-color: var(--color-border-primary, #3a3a4e); }
    .tab {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
      opacity: 0.6;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.2s;
    }
    .tab:hover { opacity: 0.8; }
    .tab.active { opacity: 1; border-bottom-color: #3b82f6; color: #3b82f6; }
    .booking-list { display: flex; flex-direction: column; gap: 10px; }
    .booking-card {
      border: 1px solid var(--color-border-primary, #e0e0e0);
      border-radius: 8px;
      padding: 14px;
      background: var(--color-background-secondary, #f8f9fa);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    [data-theme="dark"] .booking-card {
      background: var(--color-background-secondary, #2a2a3e);
      border-color: var(--color-border-primary, #3a3a4e);
    }
    .booking-info { flex: 1; }
    .booking-spot { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .booking-detail { font-size: 12px; opacity: 0.7; margin-bottom: 2px; }
    .booking-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
    }
    .badge-confirmed { background: #dcfce7; color: #166534; }
    .badge-pending { background: #fef3c7; color: #92400e; }
    .badge-cancelled { background: #fee2e2; color: #991b1b; }
    .badge-completed { background: #dbeafe; color: #1d4ed8; }
    [data-theme="dark"] .badge-confirmed { background: #14532d; color: #86efac; }
    [data-theme="dark"] .badge-pending { background: #78350f; color: #fcd34d; }
    [data-theme="dark"] .badge-cancelled { background: #7f1d1d; color: #fca5a5; }
    [data-theme="dark"] .badge-completed { background: #1e3a5f; color: #93c5fd; }
    .btn {
      padding: 6px 12px;
      border: 1px solid var(--color-border-primary, #e0e0e0);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      background: none;
      color: inherit;
      transition: all 0.2s;
    }
    .btn:hover { background: var(--color-background-secondary, #f0f0f0); }
    .btn-danger { border-color: #ef4444; color: #ef4444; }
    .btn-danger:hover { background: #fef2f2; }
    [data-theme="dark"] .btn-danger:hover { background: #450a0a; }
    .empty-state { text-align: center; padding: 40px 20px; opacity: 0.6; }
    .loading { text-align: center; padding: 40px; opacity: 0.6; }
    .count { font-size: 12px; opacity: 0.6; margin-bottom: 12px; }
    .stat-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .stat-card {
      flex: 1;
      min-width: 120px;
      padding: 12px;
      border-radius: 8px;
      background: var(--color-background-secondary, #f8f9fa);
      border: 1px solid var(--color-border-primary, #e0e0e0);
      text-align: center;
    }
    [data-theme="dark"] .stat-card {
      background: var(--color-background-secondary, #2a2a3e);
      border-color: var(--color-border-primary, #3a3a4e);
    }
    .stat-value { font-size: 24px; font-weight: 700; color: #3b82f6; }
    .stat-label { font-size: 11px; opacity: 0.6; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <h2>My Bookings</h2>
    <p>View and manage your parking bookings</p>
  </div>
  <div id="stats" class="stat-row"></div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-filter="all">All</button>
    <button class="tab" data-filter="confirmed">Confirmed</button>
    <button class="tab" data-filter="pending">Pending</button>
    <button class="tab" data-filter="completed">Completed</button>
    <button class="tab" data-filter="cancelled">Cancelled</button>
  </div>
  <div id="count" class="count"></div>
  <div id="content" class="loading">Loading your bookings...</div>
  <script type="module" src="/src/my-bookings.ts"></script>
</body>
</html>
